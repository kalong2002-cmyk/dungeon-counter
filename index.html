<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dungeon Card Counter</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* 倒數第二個數的輕微閃爍動畫 */
        @keyframes softPulse {
            0% {
                border-color: #e67e22;
                box-shadow: 0 0 4px rgba(230, 126, 34, 0.3);
            }
            50% {
                border-color: #f39c12;
                box-shadow: 0 0 10px rgba(243, 156, 18, 0.7);
            }
            100% {
                border-color: #e67e22;
                box-shadow: 0 0 4px rgba(230, 126, 34, 0.3);
            }
        }

        /* 最後一個數（滿格）的強烈閃爍動畫 */
        @keyframes intensePulse {
            0% {
                border-color: #e74c3c;
                box-shadow: 0 0 6px rgba(231, 76, 60, 0.5);
            }
            50% {
                border-color: #ff3838;
                box-shadow: 0 0 20px rgba(255, 56, 56, 1);
            }
            100% {
                border-color: #e74c3c;
                box-shadow: 0 0 6px rgba(231, 76, 60, 0.5);
            }
        }

        .soft-glow {
            animation: softPulse 1.5s infinite ease-in-out;
        }

        .intense-glow {
            animation: intensePulse 0.8s infinite ease-in-out;
        }

        body {
            font-family: 'Cinzel', 'Georgia', serif, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #121216;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 {
            margin-bottom: 20px;
            color: #d4af37;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 160px);
            gap: 20px;
            margin-bottom: 20px;
        }
        .counter-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1e1e24;
            border: 2px solid #3a3a48;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
            transition: all 0.3s;
        }

        .box {
            width: 130px;
            height: 110px;
            background: linear-gradient(135deg, #2c2c38 0%, #1a1a24 100%);
            border: 1px solid #4a4a5e;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s;
            margin-bottom: 8px;
            position: relative;
            overflow: hidden;
        }
        .box:hover {
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        .number {
            font-size: 48px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            z-index: 2;
        }
        .label {
            font-size: 11px;
            color: #8c8c9e;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 2;
        }

        /* 底部能量條 */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 6px;
            transition: width 0.3s, background 0.3s;
            z-index: 1;
        }

        .item-reset-btn {
            width: 100%;
            padding: 6px;
            font-size: 12px;
            background-color: #2d2d3a;
            color: #b0b0c0;
            border: 1px solid #4a4a5e;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .item-reset-btn:hover {
            background-color: #4a4a5e;
            color: #ffffff;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .action-btn {
            padding: 10px 20px;
            font-size: 16px;
            color: #ffffff;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }
        .reset-btn {
            background: linear-gradient(135deg, #8b0000 0%, #500000 100%);
            border: 1px solid #b22222;
        }
        .reset-btn:hover {
            background: linear-gradient(135deg, #a50000 0%, #600000 100%);
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        }
        .add-all-btn {
            background: linear-gradient(135deg, #16a085 0%, #117a65 100%);
            border: 1px solid #1abc9c;
        }
        .add-all-btn:hover {
            background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
            box-shadow: 0 0 8px rgba(26, 188, 156, 0.5);
        }
        .control-panel {
            background: #1e1e24;
            border: 1px solid #3a3a48;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .control-panel label {
            font-size: 14px;
            font-weight: bold;
            color: #d4af37;
        }
        .control-panel input {
            width: 60px;
            padding: 6px;
            font-size: 16px;
            text-align: center;
            background-color: #121216;
            color: #f1c40f;
            border: 1px solid #4a4a5e;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h2>Dungeon Card Counters</h2>
    <div class="grid" id="grid"></div>
    
    <div class="button-group">
        <button class="action-btn add-all-btn" onclick="addAll()">All +1</button>
        <button class="action-btn reset-btn" onclick="resetAll()">Reset All</button>
    </div>

    <div class="control-panel">
        <label for="maxLimitInput">Max Limit:</label>
        <input type="number" id="maxLimitInput" value="4" min="1" max="99" onchange="updateMaxLimit(this)">
    </div>

    <script>
        let counts = [1, 1, 1, 1, 1, 1];
        let maxLimit = 4;

        function updateMaxLimit(input) {
            let val = parseInt(input.value);
            if (isNaN(val) || val < 1) {
                val = 1;
                input.value = 1;
            }
            maxLimit = val;

            counts.forEach((val, index) => {
                if (val > maxLimit) {
                    counts[index] = 1;
                }
            });
            render();
        }

        function render() {
            const grid = document.getElementById('grid');
            if (!grid) return;
            grid.innerHTML = '';
            
            counts.forEach((val, index) => {
                const card = document.createElement('div');
                card.className = 'counter-card';
                
                let isMax = (val === maxLimit);
                let isSecondToLast = (maxLimit > 1 && val === maxLimit - 1);
                let ratio = maxLimit > 1 ? (val - 1) / (maxLimit - 1) : 1;
                let barColor = '';
                let borderColor = '#3a3a48';

                if (isMax) {
                    barColor = 'linear-gradient(90deg, #e67e22, #e74c3c)';
                    card.classList.add('intense-glow');
                } else if (isSecondToLast) {
                    barColor = 'linear-gradient(90deg, #f1c40f, #e67e22)';
                    card.classList.add('soft-glow');
                } else {
                    if (ratio < 0.5) {
                        barColor = 'linear-gradient(90deg, #2980b9, #f1c40f)';
                    } else {
                        barColor = 'linear-gradient(90deg, #f1c40f, #e67e22)';
                        borderColor = '#e67e22';
                    }
                    card.style.borderColor = borderColor;
                }

                let percentage = maxLimit > 1 ? ((val - 1) / (maxLimit - 1)) * 100 : 100;
                if (maxLimit === 1) percentage = 100;

                card.innerHTML = `
                    <div class="box" onclick="increment(${index})">
                        <div class="number">${val}</div>
                        <div class="label">Tap Card</div>
                        <div class="progress-bar" style="width: ${percentage}%; background: ${barColor};"></div>
                    </div>
                    <button class="item-reset-btn" onclick="resetItem(${index})">Reset</button>
                `;
                grid.appendChild(card);
            });
        }

        function increment(index) {
            counts[index] = counts[index] >= maxLimit ? 1 : counts[index] + 1;
            render();
        }

        function resetItem(index) {
            counts[index] = 1;
            render();
        }

        function addAll() {
            for (let i = 0; i < counts.length; i++) {
                counts[i] = counts[i] >= maxLimit ? 1 : counts[i] + 1;
            }
            render();
        }

        function resetAll() {
            counts = [1, 1, 1, 1, 1, 1];
            render();
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
